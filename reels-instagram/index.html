<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #0b1020;
      }
      #root {
        position: relative; width: 100%; height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f8fafc;
        background: radial-gradient(circle at 30% 20%, #1e3a8a 0%, #0b1020 60%);
      }
      /* Zone sûre Reels : ~250px en haut, ~420px en bas (UI Instagram) */
      .scene {
        position: absolute; left: 90px; right: 90px; top: 250px; bottom: 420px;
        display: flex; flex-direction: column; justify-content: center; gap: 40px;
      }
      .kicker { font-size: 44px; font-weight: 600; color: #fbbf24; letter-spacing: 0.02em; }
      .big { font-size: 112px; font-weight: 800; line-height: 1.02; letter-spacing: -0.03em; }
      .chips { display: flex; flex-wrap: wrap; gap: 24px; }
      .chip {
        font-size: 48px; font-weight: 700; padding: 20px 36px; border-radius: 999px;
        background: #f8fafc; color: #0b1020;
      }
      .cta {
        font-size: 60px; font-weight: 800; padding: 36px 48px; border-radius: 28px;
        background: #fbbf24; color: #0b1020; align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qv3y" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

      <div data-hf-id="hf-n53x" id="s1" class="scene clip" data-start="0" data-duration="5" data-track-index="0">
        <div data-hf-id="hf-enq4" class="kicker">Formations certifiantes</div>
        <div data-hf-id="hf-mb2h" class="big">Boostez votre carrière en gestion de projet</div>
      </div>

      <div data-hf-id="hf-187d" id="s2" class="scene clip" data-start="5" data-duration="5" data-track-index="0">
        <div data-hf-id="hf-lbsa" class="kicker">Les certifications les plus demandées</div>
        <div data-hf-id="hf-exrd" class="chips">
          <span data-hf-id="hf-uxg8" class="chip">PMP</span><span data-hf-id="hf-o0n1" class="chip">PSM</span>
          <span data-hf-id="hf-91ma" class="chip">SAFe</span><span data-hf-id="hf-f6z0" class="chip">PRINCE2</span>
          <span data-hf-id="hf-mo8b" class="chip">ITIL 4</span><span data-hf-id="hf-9c0y" class="chip">ISTQB</span>
        </div>
      </div>

      <div data-hf-id="hf-qwb8" id="s3" class="scene clip" data-start="10" data-duration="5" data-track-index="0">
        <div data-hf-id="hf-hajm" class="big">Formez vos équipes avec un expert certifié</div>
        <div data-hf-id="hf-1jad" class="cta">Contactez-moi →</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#s1 .kicker", { opacity: 0, y: 30, duration: 0.5 }, 0.2)
        .from("#s1 .big", { opacity: 0, y: 60, duration: 0.7, ease: "power3.out" }, 0.4)
        .from("#s2 .kicker", { opacity: 0, y: 30, duration: 0.5 }, 5.2)
        .from("#s2 .chip", { opacity: 0, scale: 0.6, duration: 0.4, stagger: 0.15, ease: "back.out(2)" }, 5.5)
        .from("#s3 .big", { opacity: 0, y: 60, duration: 0.7, ease: "power3.out" }, 10.2)
        .from("#s3 .cta", { opacity: 0, scale: 0.8, duration: 0.5, ease: "back.out(2)" }, 11);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
